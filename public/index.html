<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4d3a" />
    <meta name="description" content="Pray in the words of Scripture with Matthew Henry’s A Method for Prayer (1710). A guided prayer in six parts, the whole book, and prayers for occasions. Free, with no account." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>A Method for Prayer</title>
    <!-- The react-native-web style reset. The screens scroll in a <ScrollView>, not the body. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f4f5ef;
        color: #1a211c;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #111814;
          color: #e2e6dd;
        }
        #seo a {
          color: #8cc4a5;
        }
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      #seo a {
        color: #1f4d3a;
      }
      #seo h1 {
        font-size: 1.5em;
        line-height: 1.25;
      }
      #seo cite {
        font-size: 0.8em;
        font-style: normal;
        font-weight: 600;
      }
      noscript {
        display: block;
        padding: 8px 16px;
        font: 14px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>The app needs JavaScript. The text of each page is below.</noscript>
    <div id="root"></div>
  </body>
</html>
